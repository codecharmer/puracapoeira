name: Publish Android APK

# Manually publishes the Android APK built by EAS to the live site at
# https://puracapoeira.com/wp-content/uploads/app/pura-capoeira.apk.
#
# EAS artifact links expire after ~two weeks, so the durable download the site
# links to lives in wp-content/uploads/app/, which the theme/plugin deploys
# never touch. Each run replaces the canonical pura-capoeira.apk and keeps a
# copy next to it whose name carries the version and the build number
# (pura-capoeira-0.2.0-8.apk).
#
# The address of the download never changes, but a browser saves the file under
# that versioned name, because the folder's .htaccess sends the name along with
# the canonical file. On a phone that still has an older download, the names
# show which file is which. Version and build number are read from the APK
# itself, not typed by whoever starts the run.
#
# Nothing is uploaded before "Check Android APK" (check-apk.yml) has installed
# the file on Android emulators, opened the app and installed it as an update
# over the file the site offers. The file that is uploaded is the one that was
# checked, not a second download.
#
# Run it from Actions → "Publish Android APK" with the artifact URL printed by
# `eas build -p android --profile preview` (or `eas build:list`).
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: EAS build artifact URL of the .apk
        required: true
        type: string

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check-apk.yml
    with:
      apk_url: ${{ inputs.apk_url }}

  publish:
    name: Upload
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.WP_DEPLOY_ENABLED == 'true' }}
    concurrency:
      # Same group as the WordPress deploy so the two never run at once. On the job, not the
      # workflow, so the check does not hold up a deploy.
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DOWNLOAD_URL: https://puracapoeira.com/wp-content/uploads/app/pura-capoeira.apk
      # What the check read in the file.
      VERSION_NAME: ${{ needs.check.outputs.version_name }}
      VERSION_CODE: ${{ needs.check.outputs.version_code }}

    steps:
      - name: Get the APK that passed the check
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Give it the published name
        run: mv app.apk pura-capoeira.apk

      - name: Sanity-check the APK
        run: |
          size=$(stat -c%s pura-capoeira.apk)
          echo "size: ${size} bytes"
          sha256sum pura-capoeira.apk
          [ "$size" -ge 20000000 ] || { echo 'Smaller than 20 MB; not a release APK?'; exit 1; }
          unzip -l pura-capoeira.apk | grep -q 'AndroidManifest.xml' \
            || { echo 'No AndroidManifest.xml inside; not an APK.'; exit 1; }

      # From the file, not from whoever starts the run, so the name cannot say another version
      # than the file has.
      - name: Work out the versioned name
        run: |
          export LC_ALL=C
          echo "The file is version ${VERSION_NAME:-(none)}, build ${VERSION_CODE:-(none)}."
          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ && "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::The version in the file cannot be used in a file name. Nothing was uploaded."
            exit 1
          fi
          echo "VERSIONED=pura-capoeira-${VERSION_NAME}-${VERSION_CODE}.apk" >> "$GITHUB_ENV"
          echo "Versioned name: pura-capoeira-${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check the target is a WordPress install
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -f '${{ secrets.DEPLOY_PATH }}/wp-config.php' && test -d '${{ secrets.DEPLOY_PATH }}/wp-content' \
             || { echo 'DEPLOY_PATH does not contain a WordPress install (no wp-config.php / wp-content)'; exit 1; }"

      # Apache serves .apk as application/octet-stream by default; the one-line
      # .htaccess pins the real MIME type so Android installs it cleanly. The name
      # of the download is added further down, once the new file is in place.
      - name: Prepare uploads/app (folder and APK MIME type)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/wp-content/uploads/app' && \
             printf 'AddType application/vnd.android.package-archive .apk\n' \
               > '${{ secrets.DEPLOY_PATH }}/wp-content/uploads/app/.htaccess'"

      # No --delete: older versioned APKs stay available next to the canonical file.
      - name: Upload the canonical APK and a versioned copy
        run: |
          cp pura-capoeira.apk "$VERSIONED"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.SSH_PORT }}" \
            pura-capoeira.apk "$VERSIONED" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/uploads/app/"

      # Content-Disposition makes a browser save the canonical file under the versioned name.
      # Only that file gets it: the versioned copies already carry their own names.
      - name: Write the .htaccess that names the download
        run: |
          cat > htaccess <<EOF
          AddType application/vnd.android.package-archive .apk
          <IfModule mod_headers.c>
            <Files "pura-capoeira.apk">
              Header set Content-Disposition "attachment; filename=\"$VERSIONED\""
            </Files>
          </IfModule>
          EOF
          cat htaccess

      # After the APK, so the name never runs ahead of the file.
      - name: Upload the .htaccess
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p ${{ secrets.SSH_PORT }}" \
            htaccess \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/wp-content/uploads/app/.htaccess"

      - name: Fix ownership and permissions
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "d='${{ secrets.DEPLOY_PATH }}/wp-content/uploads/app'; \
             chown -R puracapoeirasite:puracapoeirasite \"\$d\" && \
             find \"\$d\" -type d -exec chmod 755 {} \; && \
             find \"\$d\" -type f -exec chmod 644 {} \;"

      - name: Clear cPanel NGINX cache
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "if [ -x /usr/local/cpanel/scripts/ea-nginx ]; then \
               /usr/local/cpanel/scripts/ea-nginx clear_cache puracapoeirasite && /usr/local/cpanel/scripts/ea-nginx reload; \
             else echo 'ea-nginx not present; nothing to clear.'; fi"

      # The download as a member gets it: saved under the name the site sends, then compared
      # with the file that passed the check.
      - name: Download it as a browser does and compare
        run: |
          mkdir downloaded
          ( cd downloaded && curl -fsS --retry 3 -D ../headers.txt -O -J "$DOWNLOAD_URL" )
          grep -iE '^(HTTP/|content-length:|content-type:|content-disposition:)' headers.txt || true
          saved=$(ls downloaded)
          echo "Saved as: $saved"
          if ! cmp -s pura-capoeira.apk "downloaded/$saved"; then
            echo "::error::The site does not serve the file that was uploaded."
            exit 1
          fi
          if ! grep -qi '^content-type: application/vnd.android.package-archive' headers.txt; then
            echo "::error::The site does not send the APK type with the file."
            exit 1
          fi
          if [ "$saved" != "$VERSIONED" ]; then
            echo "::error::The file is published, but browsers save it as $saved, not as $VERSIONED."
            exit 1
          fi

      - name: Say what was published
        run: |
          {
            echo "Published **version ${VERSION_NAME} (build ${VERSION_CODE})**."
            echo
            echo "- Download: $DOWNLOAD_URL"
            echo "- Browsers save it as \`$VERSIONED\`"
          } >> "$GITHUB_STEP_SUMMARY"
